<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thierry Sena SEHOUBO – Directeur des Systèmes d’Information</title>
<meta name="description" content="Thierry Sena SEHOUBO, Directeur des Systèmes d’Information, Cluster Orabank Togo.">
<style>
:root{--bg:#f4f8fb;--card:#fff;--ink:#0b2545;--muted:#4a5d75;--accent:#a9c7de;--line:#d5e2ec}
@media (prefers-color-scheme:dark){:root{--bg:#0b1626;--card:#12233a;--ink:#eaf2f8;--muted:#9fb3c8;--accent:#a9c7de;--line:#223a57}}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:0 16px 48px}
header{padding:72px 0 40px}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--muted);font-weight:600}
h1{font-size:clamp(1.3rem,5.4vw,3.4rem);white-space:nowrap;line-height:1.05;margin:.3em 0 .2em;text-transform:uppercase;letter-spacing:-.01em}
.role{font-size:1.25rem;color:var(--muted);margin:0}
.rule{height:3px;background:var(--ink);border:0;margin:32px 0;opacity:.85}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card a{color:var(--ink);font-weight:600;text-decoration:none;word-break:break-word}
.card a:hover,.card a:focus-visible{text-decoration:underline}
.card a.mail{font-size:clamp(.75rem,3.8vw,1rem);white-space:nowrap;word-break:normal}
.btn{display:inline-block;margin-top:24px;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
@media (prefers-color-scheme:dark){.btn{background:var(--accent);color:#0b2545}}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
footer{color:var(--muted);font-size:.9rem;margin-top:40px}
</style>
</head>
<body>
<main>
<header>
  <div class="kicker">Cluster Orabank Togo</div>
  <h1>Thierry Sena Sehoubo</h1>
  <p class="role">Directeur des Systèmes d’Information</p>
  <a class="btn" href="thierry-sehoubo.vcf" download>Ajouter à mes contacts</a>
</header>
<hr class="rule">
<section class="grid" aria-label="Contact">
  <div class="card"><h2>Portable</h2>
    <a href="tel:+22890302080">+22890 30 20 80</a><br>
    <a href="tel:+22899482080">+22899 48 20 80</a></div>
  <div class="card"><h2>Mail</h2>
    <a class="mail" href="mailto:thierry.sehoubo@orabank.net">thierry.sehoubo@orabank.net</a></div>
  <div class="card"><h2>Entreprise</h2>
    <strong>Cluster Orabank Togo</strong><br>Direction des Systèmes d’Information</div>
</section>
<footer>© Thierry Sena SEHOUBO</footer>
</main>
</body>
</html>
